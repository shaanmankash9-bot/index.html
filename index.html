<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BioCore Self-Sustained Engine</title>
    <link rel="manifest" href="data:application/json;base64,ewogICJuYW1lIjogIkJpb0NvcmUgQUkgQ2hhdCIsCiAgInNob3J0X25hbWUiOiAiQmlvQ29yZSIsCiAgInN0YXJ0X3VybCI6ICJpbmRleC5odG1sIiwKICAiaWRpc3BsYXkiOiAic3RhbmRhbG9uZSIsCiAgImJhY2tncm91bmRfY29sb3IiOiAiIzBiMGYxOSIsCiAgInRoZW1lX2NvbG9yIjogIzBiMGYxOSIKfQ==">
    <style>
        :root {
            --bg: #0b0f19;
            --panel: #131926;
            --green: #10b981;
            --dark-green: #047857;
            --text: #f3f4f6;
            --muted: #64748b;
            --user-bubble: #1f2937;
            --ai-bubble: #161b26;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body, html { height: 100%; background-color: var(--bg); color: var(--text); overflow: hidden; }
        .window { display: flex; flex-direction: column; height: 100%; width: 100%; max-width: 600px; margin: 0 auto; background: var(--bg); position: relative; }
        
        header { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; background: var(--panel); border-bottom: 1px solid #1e293b; }
        .logo { font-size: 1.1rem; font-weight: bold; color: var(--green); display: flex; align-items: center; gap: 8px; }
        .dot { width: 10px; height: 10px; background-color: var(--green); border-radius: 50%; box-shadow: 0 0 8px var(--green); }
        .badge { font-size: 0.75rem; font-weight: bold; padding: 4px 10px; border-radius: 20px; background: #1e293b; color: #f43f5e; }
        .badge.online { color: var(--green); background: rgba(16, 185, 129, 0.1); border: 1px solid var(--green); }

        .system-tray { background: #111724; padding: 12px; border-bottom: 1px solid #1e293b; text-align: center; }
        .boot-btn { background: var(--green); color: #0b0f19; border: none; padding: 10px 20px; font-weight: bold; border-radius: 6px; cursor: pointer; width: 100%; font-size: 0.9rem; }
        
        .progress-container { margin-top: 10px; background: #070a12; border: 1px solid #1e293b; padding: 10px; border-radius: 6px; display: none; text-align: left; }
        .progress-text { font-family: monospace; font-size: 0.75rem; color: #38bdf8; margin-bottom: 6px; display: flex; justify-content: space-between; }
        .progress-bar-bg { width: 100%; height: 6px; background: #1e293b; border-radius: 4px; overflow: hidden; }
        .progress-bar-fill { width: 0%; height: 100%; background: var(--green); transition: width 0.1s; }

        .chat-box { flex: 1; overflow-y: auto; padding: 20px 15px; display: flex; flex-direction: column; gap: 16px; scroll-behavior: smooth; }
        .wrapper { display: flex; width: 100%; flex-direction: column; }
        .bubble { max-width: 85%; padding: 12px 16px; border-radius: 18px; font-size: 0.95rem; line-height: 1.5; word-wrap: break-word; white-space: pre-wrap; }
        .user-side { align-self: flex-end; }
        .user-side .bubble { background-color: var(--user-bubble); color: var(--text); border-bottom-right-radius: 4px; }
        .ai-side { align-self: flex-start; }
        .ai-side .bubble { background-color: var(--ai-bubble); color: var(--text); border-bottom-left-radius: 4px; border-left: 3px solid var(--green); }
        .thought-log { font-family: monospace; font-size: 0.8rem; color: #86efac; background: rgba(16,185,129,0.03); border: 1px solid rgba(16,185,129,0.1); padding: 8px 12px; border-radius: 8px; margin-bottom: 6px; width: 85%; }

        .tray { padding: 12px; background: var(--panel); border-top: 1px solid #1e293b; display: flex; gap: 10px; align-items: center; }
        .input-wrap { flex: 1; }
        input[type="text"] { width: 100%; background: #0b0f19; border: 1px solid #334155; border-radius: 24px; padding: 12px 18px; color: var(--text); font-size: 0.95rem; outline: none; }
        input[type="text"]:focus { border-color: var(--green); }
        .send-btn { background: var(--green); border: none; width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .send-btn svg { width: 18px; height: 18px; fill: #0b0f19; transform: rotate(45deg); margin-left: -2px; margin-top: 2px; }
    </style>

    <!-- Use standard, non-restricted script loading layers to bypass black screen crashes -->
    <script src="https://jsdelivr.net"></script>
</head>
<body>

    <div class="window">
        <header>
            <div class="logo"><div class="dot"></div> BioCore Independent</div>
            <div id="engineStatus" class="badge">Brain Offline</div>
        </header>

        <div class="system-tray">
            <button id="bootButton" onclick="buildBrainLocally()" class="boot-btn">Load & Initialize Native Brain Core</button>
            
            <div id="progressUi" class="progress-container">
                <div id="progressLabel" class="progress-text">
                    <span>Connecting to network matrix nodes...</span>
                    <span>0MB / 0MB (0%)</span>
                </div>
                <div class="progress-bar-bg">
                    <div id="progressBarFill" class="progress-bar-fill"></div>
                </div>
            </div>
        </div>

        <div class="chat-box" id="chatThread"></div>

        <div class="tray">
            <div class="input-wrap">
                <input type="text" id="userInput" placeholder="Message standalone BioCore AI..." autocomplete="off" onkeydown="if(event.key === 'Enter') runLocalInference()">
            </div>
            <button class="send-btn" onclick="runLocalInference()">
                <svg viewBox="0 0 24 24"><path d="M2,21L23,12L2,3V10L17,12L2,14V21Z"/></svg>
            </button>
        </div>
    </div>

    <script>
        let localBrainEngine = null;
        const statusBadge = document.getElementById('engineStatus');
        const actionButton = document.getElementById('bootButton');
        const progressUi = document.getElementById('progressUi');
        const progressLabel = document.getElementById('progressLabel');
        const progressBarFill = document.getElementById('progressBarFill');
        const chatWindow = document.getElementById('chatThread');
        const inputField = document.getElementById('userInput');

        function onProgressUpdate(statusData) {
            if (statusData.status === 'progress') {
                progressUi.style.display = "block";
                const percentage = statusData.progress.toFixed(1);
                const downloadedMb = (statusData.loaded / (1024 * 1024)).toFixed(1);
                const totalMb = (statusData.total / (1024 * 1024)).toFixed(1);
                
                progressLabel.innerHTML = `<span>Downloading segments...</span> <span>${downloadedMb}MB / ${totalMb}MB (${percentage}%)</span>`;
                progressBarFill.style.width = `${percentage}%`;
            }
        }

        async function buildBrainLocally() {
            try {
                actionButton.disabled = true;
                statusBadge.innerText = "Downloading Brain...";
                
                // Invoke standard global constructor mappings
                localBrainEngine = await transformers.pipeline('text-generation', 'Xenova/Qwen1.5-0.5B-Chat', {
                    progress_callback: onProgressUpdate
                });
                
                statusBadge.innerText = "100% Offline Core Independent";
                statusBadge.className = "badge online";
                actionButton.style.display = "none";
                progressUi.style.display = "none";
                
                appendSystemAlert("Success: AI Brain architecture locked cleanly into device memory! Disconnect your internet completely and run your local prompts.");
            } catch (err) {
                statusBadge.innerText = "Security Interruption";
                actionButton.disabled = false;
                alert("Please launch via Chrome browser instead of the default viewer.");
            }
        }

        async function runLocalInference() {
            if (!localBrainEngine) {
                alert("Please click 'Load & Initialize Native Brain Core' first!");
                return;
            }

            const promptText = inputField.value.trim();
            if (!promptText) return;

            inputField.value = '';
            renderMessage(promptText, 'user');

            const wrapper = document.createElement('div');
            wrapper.className = 'wrapper ai-side';
            const logElement = document.createElement('div');
            logElement.className = 'thought-log';
            logElement.innerText = 'Initializing Matrix Mathematics...';
            wrapper.appendChild(logElement);
            const textBubble = document.createElement('div');
            textBubble.className = 'bubble';
            textBubble.innerText = 'Reasoning...';
            wrapper.appendChild(textBubble);
            chatWindow.appendChild(wrapper);
            chatWindow.scrollTop = chatWindow.scrollHeight;

            try {
                const internalTemplate = `<|im_start|>system\nYou are BioCore AI, a self-contained on-device scientific brain. Compute the target user problem structurally using strict physics and programming laws.<|im_end|>\n<|im_start|>user\n${promptText}<|im_end|>\n<|im_start|>assistant\n`;

                const computationResult = await localBrainEngine(internalTemplate, {
                    max_new_tokens: 250,
                    temperature: 0.2
                });

                let outputString = computationResult.generated_text;
                const cleanupMarker = outputString.lastIndexOf("<|im_start|>assistant\n");
